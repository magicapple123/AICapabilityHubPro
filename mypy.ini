[mypy]
# H2：只查本轮新增/重写的模块，存量代码逐步纳入，避免一次全量报错淹没改动。
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = False
check_untyped_defs = True

[mypy-app.service.audit_service]
[mypy-app.service.catalog_cache]
[mypy-app.service.image_client]
[mypy-app.service.provider_crypto]
[mypy-app.service.provider_guard]
