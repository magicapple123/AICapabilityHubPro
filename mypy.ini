[mypy]
# H2：只查本轮新增/重写的模块，存量代码逐步纳入，避免一次全量报错淹没改动。
# 白名单 = 下面列出的 5 个模块（audit_service 在 user/capability 两个服务里同名）。
# 本地与 CI 必须同口径（.github/workflows/quality-gate.yml 的 "Type check (mypy whitelist)"）：
#   mypy --config-file mypy.ini --follow-imports=skip <4 个 ai-chat 文件>
#   (cd services/user-service       && mypy --config-file ../../mypy.ini --follow-imports=skip app/service/audit_service.py)
#   (cd services/capability-service && mypy --config-file ../../mypy.ini --follow-imports=skip app/service/audit_service.py)
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = False
check_untyped_defs = True

[mypy-app.service.audit_service]
[mypy-app.service.catalog_cache]
[mypy-app.service.image_client]
[mypy-app.core.provider_crypto]
[mypy-app.core.provider_guard]
