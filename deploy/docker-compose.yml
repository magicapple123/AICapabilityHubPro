name: aicapabilityhubpro

services:
  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
        VITE_USE_MOCK_LOGIN: "${VITE_USE_MOCK_LOGIN:-false}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
    container_name: aihub-pro-nginx
    environment:
      NGINX_GATEWAY_UPSTREAM: "${NGINX_GATEWAY_UPSTREAM:-host.docker.internal:8080}"
      NGINX_ENVSUBST_VARS: "NGINX_GATEWAY_UPSTREAM"
    ports:
      - "${NGINX_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health | grep -q '^UP'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: aihub-pro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: aihub-pro-nacos
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    restart: unless-stopped

  sentinel:
    image: bladex/sentinel-dashboard:1.8.10
    container_name: aihub-pro-sentinel
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8858:8858"
    restart: unless-stopped

volumes:
  mysql_data:
    name: aihub-pro-mysql-data
