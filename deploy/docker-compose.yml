name: aicapabilityhubpro

services:
  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
        VITE_USE_MOCK_LOGIN: "${VITE_USE_MOCK_LOGIN:-false}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
    container_name: aihub-pro-nginx
    environment:
      NGINX_GATEWAY_UPSTREAM: "${NGINX_GATEWAY_UPSTREAM:-host.docker.internal:8080}"
      NGINX_ENVSUBST_VARS: "NGINX_GATEWAY_UPSTREAM"
    ports:
      - "${NGINX_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health | grep -q '^UP'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: aihub-pro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # A2：4 服务 × 4 worker × (pool 5 + overflow 10) = 240，默认 151 会直接连挂。
      - --max-connections=500
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: aihub-pro-nacos
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    restart: unless-stopped

  sentinel:
    image: bladex/sentinel-dashboard:1.8.10
    container_name: aihub-pro-sentinel
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8858:8858"
    restart: unless-stopped

  # ---------- G1：四个业务服务（profile=app，默认 up 不受影响） ----------
  # 就绪探针统一走 /health/ready：每次真查库，MySQL 未就绪时容器保持 unhealthy。
  user-service:
    profiles: ["app"]
    build: ../services/user-service
    environment:
      DB_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/user_db?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      NACOS_ADDR: nacos:8848
      UVICORN_WORKERS: "2"
    ports: ["8081:8081"]
    depends_on:
      mysql: { condition: service_healthy }

  billing-service:
    profiles: ["app"]
    build: ../services/billing-service
    environment:
      DB_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/billing_db?charset=utf8mb4
      NACOS_ADDR: nacos:8848
      UVICORN_WORKERS: "2"
    ports: ["8082:8082"]
    depends_on:
      mysql: { condition: service_healthy }

  capability-service:
    profiles: ["app"]
    build: ../services/capability-service
    environment:
      DB_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/capability_db?charset=utf8mb4
      NACOS_ADDR: nacos:8848
      UVICORN_WORKERS: "2"
    ports: ["8083:8083"]
    depends_on:
      mysql: { condition: service_healthy }

  ai-chat-service:
    profiles: ["app"]
    build: ../services/ai-chat-service
    environment:
      DB_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/ai_chat_db?charset=utf8mb4
      NACOS_ADDR: nacos:8848
      UVICORN_WORKERS: "2"
      PROVIDER_MASTER_KEY_V1: ${PROVIDER_MASTER_KEY_V1:-}
      PROVIDER_ALLOWED_HOSTS: ${PROVIDER_ALLOWED_HOSTS:-}
    ports: ["8090:8090"]
    depends_on:
      mysql: { condition: service_healthy }

volumes:
  mysql_data:
    name: aihub-pro-mysql-data
