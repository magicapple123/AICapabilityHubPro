server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: capability-service
          uri: lb://capability-service
          predicates:
            - Path=/api/capability/**
        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/billing/**
        - id: ai-chat-service
          uri: lb://ai-chat-service
          predicates:
            - Path=/api/chat/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            # 本地开发允许 localhost / 127.0.0.1 的任意端口：Vite 端口可能被占用而调整
            # （例如 5173 被其它项目占用时改用 5174）。非本地来源仍被拒绝；
            # 生产环境经 Nginx 同源访问，不依赖 CORS。
            allowed-origin-patterns:
              - http://localhost:[*]
              - http://127.0.0.1:[*]
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            exposed-headers:
              - X-Request-Id
            allow-credentials: true
            max-age: 3600

gateway:
  # 按路由 ID（= 服务名）限流，窗口内超限返回 429 + code=4001。
  # 阈值可用环境变量覆盖，无需改代码；enabled=false 可临时关闭。
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    rules:
      - resource: user-service
        count: ${GATEWAY_RATE_LIMIT_USER_QPS:50}
        interval-sec: 1
      - resource: capability-service
        count: ${GATEWAY_RATE_LIMIT_CAPABILITY_QPS:50}
        interval-sec: 1
      - resource: billing-service
        count: ${GATEWAY_RATE_LIMIT_BILLING_QPS:50}
        interval-sec: 1
      - resource: ai-chat-service
        count: ${GATEWAY_RATE_LIMIT_CHAT_QPS:20}
        interval-sec: 1

security:
  jwt:
    # 本地启动前设置 JWT_SECRET，且 UTF-8 编码后至少 32 字节。
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ai-capability-hub}
    ttl: ${JWT_TTL:PT24H}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
