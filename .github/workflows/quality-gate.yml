name: Pro Quality Gate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q test

  python-services:
    name: Python service checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            database: user_db
          - service: billing-service
            database: billing_db
          - service: capability-service
            database: capability_db
          - service: ai-chat-service
            database: ai_chat_db
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pro-ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppro-ci-only-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
    env:
      DB_URL: mysql+pymysql://root:pro-ci-only-password@127.0.0.1:3306/${{ matrix.database }}?charset=utf8mb4
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Initialize isolated service database
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: pro-ci-only-password
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          shopt -s nullglob
          sql_file="sql/01_init.sql"
          test -f "$sql_file"
          echo "Applying isolated table schema from $(basename "$sql_file")"
          docker exec -i -e "MYSQL_PWD=${MYSQL_ROOT_PASSWORD}" "$container_id" \
            mysql --protocol=tcp -uroot \
            < "$sql_file"
      - run: python -m pytest -q -rs
      - run: python -c "import app.main; print('import ok')"

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: '11'
          runtime: node@24
          working-directory: web
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm build

  repository:
    name: Shared repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/contract_lint.py
