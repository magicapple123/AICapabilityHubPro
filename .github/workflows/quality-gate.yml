name: Pro Quality Gate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q test

  python-services:
    name: Python service checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            database: user_db
          - service: billing-service
            database: billing_db
          - service: capability-service
            database: capability_db
          - service: ai-chat-service
            database: ai_chat_db
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pro-ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppro-ci-only-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
    env:
      DB_URL: mysql+pymysql://root:pro-ci-only-password@127.0.0.1:3306/${{ matrix.database }}?charset=utf8mb4
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.service }}/requirements.txt
            services/${{ matrix.service }}/requirements.lock.txt
      # F3：有 lock 就用 lock 装（可复现构建）；没有则退回范围约束，便于新服务渐进接入。
      - name: Install dependencies (prefer lockfile)
        shell: bash
        run: |
          # lock 由各成员本地 venv 生成，可能含平台专属包（如 pywin32）；
          # Linux runner 装不上时回退到范围约束，保证 CI 不被锁文件卡死。
          if [ -f requirements.lock.txt ] && python -m pip install -q -r requirements.lock.txt; then
            echo "installed from lockfile"
          else
            echo "lockfile not usable on this platform, falling back to requirements.txt"
            python -m pip install -q -r requirements.txt
          fi
      - name: Initialize isolated service database
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: pro-ci-only-password
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          shopt -s nullglob
          # 按文件名顺序应用**全部**迁移（01_init + 后续增量），
          # 只跑基线会让新表/新列缺失，用例直接报 1146。
          files=(sql/*.sql)
          test ${#files[@]} -gt 0
          for sql_file in "${files[@]}"; do
            echo "Applying $(basename "$sql_file")"
            docker exec -i -e "MYSQL_PWD=${MYSQL_ROOT_PASSWORD}" "$container_id" \
              mysql --protocol=tcp -uroot < "$sql_file"
          done
      - name: Reconcile peer database (billing only)
        if: matrix.service == 'billing-service'
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: pro-ci-only-password
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}' | head -n 1)"
          # 对账脚本跨库只读，本任务默认只建自己的库；这里补建 user_db 的最小表，
          # 让"账单 vs 流水"这类用例在 CI 里也能真跑，而不是被跳过。
          docker exec -i -e "MYSQL_PWD=${MYSQL_ROOT_PASSWORD}" "$container_id"             mysql --protocol=tcp -uroot -e "
              CREATE DATABASE IF NOT EXISTS user_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE TABLE IF NOT EXISTS user_db.t_points_log (
                id BIGINT NOT NULL AUTO_INCREMENT, user_id BIGINT NOT NULL,
                direction VARCHAR(8) NOT NULL, amount BIGINT NOT NULL DEFAULT 0,
                balance_after BIGINT NOT NULL DEFAULT 0, biz_type VARCHAR(32) NOT NULL DEFAULT '',
                request_id VARCHAR(64) NOT NULL, remark VARCHAR(255) NOT NULL DEFAULT '',
                create_time DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                update_time DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
                is_deleted TINYINT NOT NULL DEFAULT 0, PRIMARY KEY (id),
                UNIQUE KEY uk_points_log_request (request_id, is_deleted)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;"
      - run: python -m pytest -q -rs --junitxml=test-results.xml
      - name: Require executed database tests with zero skips
        run: python ../../scripts/check_test_report.py test-results.xml
      - run: python -c "import app.main; print('import ok')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.service }}
          path: services/${{ matrix.service }}/test-results.xml
          retention-days: 14
          if-no-files-found: error

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: '11'
          runtime: node@24
          working-directory: web
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: node --experimental-strip-types --test tests/chat-schema.test.ts tests/account-vault.test.ts
      - run: pnpm build

  repository:
    name: Shared repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install service runtime deps for contract snapshots
        run: |
          python -m pip install -r services/user-service/requirements.txt             -r services/billing-service/requirements.txt             -r services/capability-service/requirements.txt             -r services/ai-chat-service/requirements.txt
      - run: python scripts/contract_lint.py
      # deploy/mysql/init 是服务目录 sql 脚本的副本（MySQL 首次启动时执行）。
      # 服务新增迁移后不同步基线，新库就会缺列，真实服务要到 E2E 才炸（6 分钟）。
      - name: Verify the MySQL baseline matches the service migrations
        run: python scripts/devtools/sync_mysql_baseline.py --check
      # H4：OpenAPI 快照比对（预期变更请本地 --update 后随 PR 提交）
      - run: python scripts/openapi_snapshot.py --check
      # H2：类型检查（白名单模块，逐轮扩大）。口径以仓库根 mypy.ini 为准，
      # 本地与 CI 必须完全一致：同样的 5 个模块、同样的 --follow-imports=skip。
      # audit_service 在 user/capability 两个服务里同名，必须进各自目录跑，否则 mypy 报重名模块。
      - name: Type check (mypy whitelist)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'mypy>=1.10,<2'
          mypy --config-file mypy.ini --follow-imports=skip \
            services/ai-chat-service/app/service/image_client.py \
            services/ai-chat-service/app/core/provider_crypto.py \
            services/ai-chat-service/app/core/provider_guard.py \
            services/ai-chat-service/app/service/catalog_cache.py
          ( cd services/user-service && mypy --config-file ../../mypy.ini --follow-imports=skip app/service/audit_service.py )
          ( cd services/capability-service && mypy --config-file ../../mypy.ini --follow-imports=skip app/service/audit_service.py )
      # H3：依赖漏洞 + bandit。工具缺失（exit 2）与高危漏洞（exit 1）都必须让 CI 失败。
      - name: Security scan (tooling required, HIGH blocks)
        shell: bash
        run: |
          python -m pip install pip-audit bandit
          python scripts/security_scan.py --all
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - run: python -m pip install 'pytest>=8,<9'
      - name: Install service runtime deps for contract snapshots
        run: |
          python -m pip install -r services/user-service/requirements.txt             -r services/billing-service/requirements.txt             -r services/capability-service/requirements.txt             -r services/ai-chat-service/requirements.txt
      # tooling 用例测的是 scripts/，脚本模块级会 import sqlalchemy 等第三方包，
      # 必须显式声明并安装，不能靠"某个服务的 requirements 顺带带上"。
      - name: Install tooling test dependencies
        run: python -m pip install -r tests/requirements-tooling.txt
      - run: python -m pytest tests/tooling -q

  tooling-windows:
    name: Windows public tooling
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - name: Install service runtime deps for contract snapshots
        run: |
          python -m pip install -r services/user-service/requirements.txt             -r services/billing-service/requirements.txt             -r services/capability-service/requirements.txt             -r services/ai-chat-service/requirements.txt
      # tooling 用例测的是 scripts/，脚本模块级会 import sqlalchemy 等第三方包，
      # 必须显式声明并安装，不能靠"某个服务的 requirements 顺带带上"。
      - name: Install tooling test dependencies
        run: python -m pip install -r tests/requirements-tooling.txt
      - run: python -m pytest tests/tooling -q
      - name: Validate PowerShell syntax and portable baseline guard
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell parse failed: $($file.Name)" }
          }
          ./scripts/Assert-ProjectBaseline.ps1 -ProjectRoot $PWD -SourceRoot "$env:RUNNER_TEMP/not_present_source"

  leader-integration:
    name: Leader real-service integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      nacos:
        image: nacos/nacos-server:v2.5.1
        env:
          MODE: standalone
          JVM_XMS: 256m
          JVM_XMX: 512m
        ports:
          - 8848:8848
          - 9848:9848
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/*/requirements.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install isolated service environments
        run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          for service in sorted(Path('services').glob('*-service')):
              environment = service / '.venv'
              subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True)
              subprocess.run([str(environment / 'bin/python'), '-m', 'pip', 'install', '-r', str(service / 'requirements.txt')], check=True)
          PY
      - name: Test and package Gateway
        run: mvn -q -f gateway/pom.xml package
      - uses: pnpm/setup@v3
        with:
          version: '11'
          runtime: node@24
          working-directory: web
          cache: true
          require-lockfile: true
      - name: Install Chromium for browser acceptance
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Verify leader chain with the existing published catalog
        run: python scripts/run_leader_e2e.py --nacos 127.0.0.1:8848 --catalog-mode market --browser
      - name: Verify the full leader chain with the strict internal catalog
        run: python scripts/run_leader_e2e.py --nacos 127.0.0.1:8848 --catalog-mode internal --browser
      - name: Require real browser and strict internal catalog evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = list(Path('artifacts/leader-e2e').glob('*/summary.json'))
          if not reports:
              raise SystemExit('Leader E2E summary.json was not produced.')
          report = max(reports, key=lambda path: path.stat().st_mtime_ns)
          summary = json.loads(report.read_text(encoding='utf-8'))
          if summary.get('catalog_mode') != 'internal' or summary.get('passed') is not True:
              raise SystemExit(f'Unexpected or failed leader E2E summary: {report}')
          if summary.get('browser_verified') is not True:
              raise SystemExit('Real browser acceptance is not recorded as passed.')
          if summary.get('member_internal_contract_verified') is not True:
              raise SystemExit('Strict GET /internal/capability/{id} probe did not verify successfully.')
          print(f'Strict internal catalog contract verified by {report}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leader-real-service-evidence
          path: artifacts/leader-e2e/
          retention-days: 14
          if-no-files-found: error
